name: App

# The desktop app (app/, Tauri) has its own versions and tags: app-v0.1.0 builds the Windows
# installer and puts it into a draft GitHub release. Changes to the app also build it on pull
# requests and main, without a release. Server releases (v*) are ci.yml.
on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@v4

      # A tag app-v0.2.0 must match the version in tauri.conf.json, else the installer would be
      # named after another version than the release.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in app/src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: app

      # Builds the frontend in app mode (beforeBuildCommand) and the NSIS installer. With a tag it
      # also creates the draft release and uploads the installer; publish it by hand on GitHub.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: "audium for Windows __VERSION__"
          releaseBody: "Desktop app for an audium server. Install, start, enter the server address and log in. The installer is not signed yet: Windows SmartScreen asks once (More info > Run anyway)."
          releaseDraft: true

      # Every build, also without a tag: the installer to try out from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: audium-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
