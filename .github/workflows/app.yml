name: App

# The desktop app (app/, Tauri) has its own versions and tags: app-v0.1.0 builds the Windows
# installer and puts it into a draft GitHub release. Changes to the app also build it on pull
# requests and main, without a release. Server releases (v*) are ci.yml.
#
# Updates (app/src-tauri/src/update.rs): a tag build also signs the installer for the updater
# (secret TAURI_SIGNING_PRIVATE_KEY) and adds latest.json to the draft. Installed apps look for
# that file in the fixed release "app-update"; it is copied there only when the draft is
# published by hand, so nobody gets a version before it is released.
on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    if: github.event_name != 'release'
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@v4

      # A tag app-v0.2.0 must match the version in tauri.conf.json, else the installer would be
      # named after another version than the release.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in app/src-tauri/tauri.conf.json"
            exit 1
          fi

      # Without the key a release could not update itself, and the next one could not update it.
      - name: Signing key for updates
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (docs/development.md, app updates)"
            exit 1
          fi
          # For `tauri build` below, merged into tauri.conf.json: the signed installer and
          # latest.json. (Not inline in `args:` below: its closing braces would end the expression
          # there. Nor may this script name the expression syntax itself, not even in a comment.)
          echo 'TAURI_BUILD_ARGS=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: app

      # Builds the frontend in app mode (beforeBuildCommand) and the NSIS installer. With a tag it
      # also signs it for the updater, creates the draft release and uploads the installer, its
      # signature and latest.json; publish it by hand on GitHub. Builds without a tag (pull
      # requests, also from forks) have no key and make no update files.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ env.TAURI_BUILD_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: "audium for Windows __VERSION__"
          releaseBody: "Desktop app for an audium server. Install, start, enter the server address and log in. The installer is not signed yet: Windows SmartScreen asks once (More info > Run anyway)."
          releaseDraft: true

      # Every build, also without a tag: the installer to try out from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: audium-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publishing an app release on GitHub (by hand, the draft from above) makes it the update for
  # the installed apps: its latest.json goes into the fixed release "app-update", the address in
  # app/src-tauri/tauri.conf.json (plugins.updater). That release is a pre-release, so "latest"
  # on GitHub stays the server's release.
  update-channel:
    name: Publish app update
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Copy latest.json to the release app-update
        run: |
          gh release download "$TAG" --pattern latest.json --dir manifest
          version=$(jq -r .version manifest/latest.json)
          if [ "app-v$version" != "$TAG" ]; then
            echo "::error::latest.json of $TAG announces version $version"
            exit 1
          fi
          # The installers must be those of this (now published) release, not a draft address.
          if jq -r '.platforms[].url' manifest/latest.json | grep -v "/releases/download/$TAG/"; then
            echo "::error::latest.json of $TAG points to other downloads (above)"
            exit 1
          fi
          if ! gh release view app-update > /dev/null 2>&1; then
            gh release create app-update --prerelease --latest=false \
              --title "audium for Windows: updates" \
              --notes "Not a release. The installed Windows apps look here for new versions (latest.json). Downloads: the releases app-v*."
          fi
          gh release upload app-update manifest/latest.json --clobber
