[package]
name = "audium-app"
version = "0.1.0"
description = "audium: the desktop app for an audium music server"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# staticlib/cdylib: the same crate becomes the Android/iOS app later.
name = "audium_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
