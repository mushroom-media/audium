[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "audium"
version = "0.1.3"
description = "Self-hosted music streaming server for large local libraries"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1",
    # AES-GCM for the Subsonic app passwords (stored encrypted, see docs/subsonic.md)
    "cryptography>=42",
    "mutagen>=1.47",
    "pillow>=10.4",
    "structlog>=24.1",
    "xxhash>=3.4",
    "numpy>=1.26",
    # Audio analysis. Wheels exist for x86_64 only; elsewhere audium runs without analysis.
    "essentia>=2.1b6.dev1389; platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
audium = "audium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["audium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults
    "UP046",  # pydantic generic models keep the Generic[T] form
    "SIM105", # explicit try/except/pass reads clearer in parsers
]

[tool.ruff.lint.per-file-ignores]
"audium/db/migrations/*" = ["E501"]
"audium/i18n.py" = ["E501"]  # one text per line, however long
"tests/*" = ["E501"]  # long URLs in assertions read better unwrapped
