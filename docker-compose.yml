# audium deployment.
#   cp .env.example .env        # optional: set AUDIUM_MUSIC_PATH (and the port, if you like)
#   docker compose up -d
#   then open http://<server>:8091 in a browser within 30 minutes: it guides you through the rest
#
# Update: docker compose pull && docker compose up -d
# Build the image from this repository instead (developers, or to change the image):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# audium only sees what you mount here. Mount every music folder read-only below /music;
# each top-level folder (here: /music/main and /music/nas) becomes its own library folder.
services:
  audium:
    # "0.1" follows bug-fix releases (0.1.1, 0.1.2, ...); a new minor version is a deliberate change here.
    image: ghcr.io/mushroom-media/audium:0.1
    container_name: audium
    restart: unless-stopped
    ports:
      # host port : container port (audium always listens on 8080 inside the container)
      - "${AUDIUM_HOST_PORT:-8091}:8080"
    volumes:
      - ./data:/data                     # database, cover cache; back this up
      - "${AUDIUM_MUSIC_PATH:-./music}:/music/main:ro"  # read-only; default: the folder ./music
      # - /mnt/nas/music:/music/nas:ro   # more folders: one line each
    environment:
      TZ: ${TZ:-Europe/Berlin}
      AUDIUM_ADMIN_USER: ${AUDIUM_ADMIN_USER:-}
      AUDIUM_ADMIN_PASSWORD: ${AUDIUM_ADMIN_PASSWORD:-}
      # AUDIUM_BASE_PATH: /audium      # when served under a sub-path by a reverse proxy
      # AUDIUM_TRUSTED_PROXIES: "*"    # trust X-Forwarded-* from your reverse proxy
      # AUDIUM_SCAN_INTERVAL_MINUTES: 360
    # The container runs as uid 1000. ./data must be writable for it:
    #   mkdir -p data && sudo chown -R 1000:1000 data
    # or run as your own user instead (id -u / id -g):
    # user: "1000:1000"
